openapi: 3.0.0
info:
  title: Core System Startup Validation API
  description: API for validating system startup and health checks
  version: v1
paths:
  /api/health:
    get:
      summary: Get overall system health status
      operationId: getSystemHealth
      tags:
        - Health
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: System is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /api/health/readiness:
    get:
      summary: Get system readiness status
      operationId: getReadinessStatus
      tags:
        - Health
      responses:
        '200':
          description: System is ready to serve requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: System is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /api/health/liveness:
    get:
      summary: Get system liveness status
      operationId: getLivenessStatus
      tags:
        - Health
      responses:
        '200':
          description: System is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: System is dead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /api/startup/events:
    get:
      summary: Get startup events
      operationId: getStartupEvents
      tags:
        - Startup
      parameters:
        - name: limit
          in: query
          description: Number of events to return
          required: false
          schema:
            type: integer
            format: int32
            default: 50
      responses:
        '200':
          description: List of startup events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StartupEvent'

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum:
            - UP
            - DOWN
            - UNKNOWN
        components:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ComponentHealth'
        details:
          type: object
          properties:
            startupTimeMs:
              type: integer
              format: int64
            timestamp:
              type: string
              format: date-time
    ComponentHealth:
      type: object
      properties:
        status:
          type: string
          enum:
            - UP
            - DOWN
            - UNKNOWN
        responseTimeMs:
          type: integer
          format: int64
        details:
          type: object
    StartupEvent:
      type: object
      properties:
        eventId:
          type: string
        eventType:
          type: string
          enum:
            - STARTING
            - CONFIG_VALIDATION
            - DB_CONNECTING
            - DB_MIGRATING
            - SERVICE_INITIALIZING
            - READY
            - ERROR
        timestamp:
          type: string
          format: date-time
        message:
          type: string
        severity:
          type: string
          enum:
            - INFO
            - WARN
            - ERROR
        details:
          type: object